name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-py3.13
          restore-keys: |
            ${{ runner.os }}-pip-py3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pytest pytest-qt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --tb=short

      # 解析器测试此前只能手工跑：每个断言都起一个 powershell 子进程。决策模块
      # 拆出来之后它们在本进程内跑完，才付得起流水线的代价。
      - name: Resolver decision tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/ps/test-resolve.ps1

      - name: Resolver claim and GC tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/ps/test-resolve-claim.ps1
